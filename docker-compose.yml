services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      torro:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Verify the full proxy path to the backend. localhost resolves to ::1 in this
      # image but nginx listens on IPv4, so use 127.0.0.1 over the HTTPS vhost.
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1:443/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  torro:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - QBIT_URL=http://qbittorrent:8080
      - JACKETT_URL=http://jackett:9117
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - DOWNLOADS_PATH=/downloads
      - DATA_DIR=/data
      - RP_ID=localhost
      - RP_NAME=Torro
      - NODE_ENV=production
      - COOKIE_SECURE=false
    volumes:
      - downloads:/downloads
      - torro_data:/data
      - ./.env:/run/config/.env:ro
    depends_on:
      qbittorrent:
        condition: service_healthy
      jackett:
        # Search is non-critical — don't block the app if Jackett is slow/down.
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=8080
    volumes:
      - downloads:/downloads
      - qbit_config:/config
    ports:
      - "9090:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - jackett_config:/config
    # Bound to loopback so you can open the Jackett UI locally to add indexers.
    ports:
      - "127.0.0.1:9117:9117"
    restart: unless-stopped
    healthcheck:
      # GET (not --spider/HEAD) — Jackett 302-redirects HEADs to a cookie test.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9117/UI/Login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Solves Cloudflare challenges so Jackett can reach protected indexers (1337x, …).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    expose:
      - "8191"
    restart: unless-stopped

volumes:
  downloads:
  qbit_config:
  jackett_config:
  torro_data:
